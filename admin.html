<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订餐管理后台</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header><a class="brand" href="/"> <span class="logo">食</span><span>订餐管理<small>每一份订单，心中有数</small></span></a><button id="logout" class="order-link" hidden>退出</button></header><main><section id="login"><h2>登录管理后台</h2><form id="loginForm"><label class="field">管理员密码<input type="password" name="password" required autocomplete="current-password"></label><button class="primary full">登录</button></form></section><section id="dashboard" hidden><div class="menu-head"><h2>订单列表</h2><button id="refresh" class="order-link">刷新</button></div><nav id="views"><button class="active" data-view="orders">订单管理</button><button data-view="trash">订单回收站</button></nav><label class="field" id="dateField">订餐日期<input id="date" type="date"></label><nav id="statuses"><button class="active" data-status="全部">全部</button><button data-status="待处理">待处理</button><button data-status="已完成">已完成</button><button data-status="已取消">已取消</button></nav><label class="search"><input id="query" placeholder="搜索姓名、电话、地点"></label><div id="stats" class="order-card" style="margin-top:18px"></div><div class="batch-tools"><label><input type="checkbox" id="selectAll"> 全选当前列表</label><span id="selectedCount">已选 0 单</span><button id="batchDelete" class="order-link danger" disabled>批量删除</button><button id="batchRestore" class="order-link" hidden disabled>恢复所选</button><button id="clearTrash" class="order-link danger" hidden>清空回收站</button></div><div id="list"></div><details class="order-card"><summary>修改管理员密码</summary><form id="passwordForm"><label class="field">当前密码<input name="current" type="password" required autocomplete="current-password"></label><label class="field">新密码（6位数字）<input name="password" type="password" required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="new-password"></label><label class="field">再次输入新密码<input name="confirm" type="password" required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="new-password"></label><p class="hint">修改后需要重新登录，请保存新密码。</p><button class="primary full">保存新密码</button><p id="passwordMessage" class="hint" role="status"></p></form></details></section><p id="message" role="status" class="hint"></p></main></div><script src="/admin.js"></script></body></html>
